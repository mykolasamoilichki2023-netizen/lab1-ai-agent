name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Run CI on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\ci.bat
      - name: Run CI on Linux and macOS
        if: runner.os != 'Windows'
        run: bash scripts/ci.sh
